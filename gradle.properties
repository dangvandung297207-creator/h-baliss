# Gradle settings
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Parchment parameter names (https://parchmentmc.org/docs/getting-started)
# Comment these two lines out if the Parchment maven is unreachable on your network.
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Environment
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neo_version=21.1.250
neo_version_range=[21.1.0,)
loader_version_range=[4,)

# Mod
mod_id=herbalistscraft
mod_name=Herbalist's Craft
mod_license=All Rights Reserved
mod_version=1.0.0
mod_group_id=com.herbalistscraft
mod_authors=Herbalist's Craft Team
mod_description=A deep herbalism, apothecary and survival system: 49 wild herbs, seasonal growth, mortar, mill, drying rack, the Herbalist's Table, discoverable medicine recipes, weapon coatings, salves, teas, a field journal, an herbalist villager and rare herbalist structures.\nOptional (never required): Tough As Nails temperature/hydration, Serene Seasons / Tough As Nails seasons.
