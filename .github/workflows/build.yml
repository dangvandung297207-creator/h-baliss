name: Build

# Builds the mod jar on every push to a working branch, and publishes the jar as a GitHub
# release asset when a version tag is pushed. The release is created from the tag, so the jar
# and the source always match.

on:
  push:
    branches:
      - main
      - "arena/**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build jar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Make the wrapper executable
        run: chmod +x ./gradlew

      # The build log is echoed back as check annotations so compile errors are visible
      # from the run summary without downloading artifacts.
      - name: Build
        run: |
          set +e -o pipefail
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "## Compile errors"
              echo '```'
              grep -E "error:" build.log | head -400
              echo '```'
              echo "## Failure"
              echo '```'
              grep -E "^(FAILURE|\* What went wrong|Execution failed|Cannot|Could not|error:)" build.log | head -40
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -E "\.java:[0-9]+: error:" build.log | head -10 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit "$status"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Collect jar
        id: jar
        run: |
          set -euo pipefail
          mkdir -p dist
          find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -exec cp {} dist/ \;
          ls -l dist
          echo "file=$(ls dist/*.jar | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: herbalistscraft-jar
          path: dist/*.jar
          if-no-files-found: error

      # GitHub's log and artifact endpoints are not always reachable from every environment;
      # the log is committed to the branch so it can always be read (and grepped) directly.
      - name: Record build log
        if: always()
        run: |
          set +e
          mkdir -p ci
          if [ ! -f build.log ]; then
            echo "no build log was produced" > build.log
          fi
          {
            echo "# Herbalist's Craft build log"
            echo
            echo "- commit: ${GITHUB_SHA}"
            echo "- branch: ${GITHUB_REF_NAME}"
            echo "- recorded: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- result: ${{ job.status }}"
            echo
            echo "## Errors"
            echo '```'
            grep -E "error:" build.log | head -400
            echo '```'
            echo "## Tail"
            echo '```'
            tail -40 build.log
            echo '```'
          } > ci/last-build.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci/last-build.log
          git commit -m "CI: record build log [skip ci]" >/dev/null 2>&1 || exit 0
          git push || true

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          generate_release_notes: true
          fail_on_unmatched_files: true
